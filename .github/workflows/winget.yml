name: Publish to WinGet

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (empty = latest release)
        required: false
        default: ""
      identifier:
        description: WinGet package identifier
        required: true
        default: q5n.startx

permissions:
  contents: read


jobs:
  winget:
    runs-on: windows-latest
    steps:
    - uses: vedantmgoyal9/winget-releaser@v2
      with:
        identifier: ${{ inputs.identifier }}
        installers-regex: '\.zip$'
        release-tag: ${{ inputs.tag }}
        token: ${{ secrets.WINGET_TOKEN }}
